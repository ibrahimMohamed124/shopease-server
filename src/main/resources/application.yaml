spring:
  application:
    name: shopease_server

  datasource:
    url: jdbc:postgresql://localhost:5432/shopeaseDB
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  security:
    user:
      name: admin
      password: 123456
